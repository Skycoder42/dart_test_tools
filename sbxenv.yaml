schemaVersion: "1"
name: dart-test-tools

agent: claude
kits:
  - sbx/claude:latest
  - docker.io/skycoder42/sbx-kit-flutter:latest

workspace:
  path: .
  clone: true

sandboxOptions:
  pullPolicy: always
  memory: "8g"
  cpus: 4

bindings:
  anthropic:
    oauth:
      domains:
        - platform.claude.com
        - api.anthropic.com
        - mcp-proxy.anthropic.com

lifecycle:
  postCreate:
    - name: Disable the Claude Code Bash sandbox
      command: |
        sbx exec -u 0 "$SBX_SANDBOX_NAME" sh -c '
          set -eu
          mkdir -p /etc/claude-code/managed-settings.d
          cat > /etc/claude-code/managed-settings.d/50-sbx-no-sandbox.json <<"EOF"
        {
          "sandbox": {
            "enabled": false
          }
        }
        EOF
          chmod 0644 /etc/claude-code/managed-settings.d/50-sbx-no-sandbox.json
        '
