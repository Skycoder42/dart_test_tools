schemaVersion: "1"
name: dart-test-tools

agent: claude
kits:
  - sbx/claude:latest
  - ./sbx/flutter
  - ./sbx/flutter-linux
  - ./sbx/flutter-web

workspace: .

sandboxOptions:
  pullPolicy: always
  memory: "8g"
  cpus: 4

bindings:
  anthropic:
    oauth:
      domains:
        - platform.claude.com
        - api.anthropic.com
        - mcp-proxy.anthropic.com
