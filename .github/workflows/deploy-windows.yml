on:
  workflow_call:
    inputs:
      flutterSdkChannel:
        type: string
        required: false
        default: stable
        description: The Flutter-SDK channel. Passed as "channel" to "subosito/flutter-action".
      artifactPrefix:
        type: string
        required: false
        default: ""
        description: The prefix for build/bundle artifact names, combined into the normalized "<prefix>-<type>-<platform>" name. If left empty, it falls back at runtime to the package name from the pubspec.yaml in "workingDirectory". Set this to keep artifact names unique when multiple packages are built within the same pipeline.
      workingDirectory:
        type: string
        required: false
        default: .
        description: The root directory of the dart package to build and test.
      isDraft:
        type: boolean
        required: false
        default: false
        description: Whether to upload the MSIX package as a draft.
      flightId:
        type: string
        required: false
        description: An optional FlightId to publish the MSIX installer to.
    secrets:
      tenantId:
        required: true
        description: The tenantId of the EntraID Tenant used by the msstore cli.
      sellerId:
        required: true
        description: The sellerId of the Microsoft Store used by the msstore cli.
      clientId:
        required: true
        description: The clientId of the EntraID Tenant used by the msstore cli.
      clientSecret:
        required: true
        description: The clientSecret of the EntraID Tenant used by the msstore cli.
jobs:
  deploy_windows:
    name: Publish MSIX installer to Microsoft Store
    environment: msstore
    runs-on: windows-latest
    steps:
      - name: Install Flutter-SDK (${{ inputs.flutterSdkChannel }})
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: ${{ inputs.flutterSdkChannel }}
          cache: true
      - name: Download flutter binary artifacts
        run: flutter precache --universal --windows
      - name: Install tools
        uses: Skycoder42/dart_test_tools/.github/actions/install-tools@main
        with:
          withDartTestTools: "false"
      - name: Install msstore cli
        uses: microsoft/setup-msstore-cli@3b2ec9136230357ce9abc02b9d056626fb248d3f
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: resolve-artifact-prefix
        name: Resolve artifact prefix
        if: inputs.artifactPrefix == ''
        run: echo "prefix=$(yq -r .name pubspec.yaml)" >> $GITHUB_OUTPUT
        working-directory: ${{ inputs.workingDirectory }}
        shell: bash
      - name: Download windows app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifactPrefix || steps.resolve-artifact-prefix.outputs.prefix }}-msix-windows
          path: ${{ inputs.workingDirectory }}/build/windows/msix
      - name: Configure msstore cli
        run: msstore reconfigure --tenantId '${{ secrets.tenantId }}' --sellerId '${{ secrets.sellerId }}' --clientId '${{ secrets.clientId }}' --clientSecret '${{ secrets.clientSecret }}'
        working-directory: ${{ inputs.workingDirectory }}
      - name: Publish MSIX to the Microsoft Store
        run: msstore publish ${{ inputs.isDraft == 'true' && '--noCommit' || '' }} ${{ inputs.flightId != '' && format('--flightId ''{0}''', inputs.flightId) || '' }}
        working-directory: ${{ inputs.workingDirectory }}
