name: Sandbox kits

on:
  push:
    branches:
      - main
    paths:
      - sbx/**
      - .github/workflows/sbx-kits.yml
  workflow_dispatch:

permissions: {}

env:
  PLATFORMS: linux/amd64,linux/arm64
  SIGNER_WORKFLOW: Skycoder42/dart_test_tools/.github/workflows/sbx-kits.yml
  SIGNER_IDENTITY: https://github.com/Skycoder42/dart_test_tools/.github/workflows/sbx-kits.yml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  validate:
    name: Validate
    if: github.ref != 'refs/heads/main'
    uses: ./.github/workflows/sbx-kits-validate.yml
    permissions:
      contents: read

  kits:
    name: List kits
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        name: List kits to publish
        run: echo "kits=$(sbx/tool/list-kits.sh)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.kit }} kit
    needs: kits
    if: github.ref == 'refs/heads/main' && needs.kits.outputs.kits != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: docker-hub
    concurrency:
      group: sbx-kit-publish-${{ matrix.kit }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # keyless signing and attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.kits.outputs.kits) }}
    env:
      IMAGE: docker.io/skycoder42/sbx-kit-${{ matrix.kit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        name: Generate image tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=${{ matrix.version }}-${{ github.sha }}
            type=raw,value=latest
      - name: Install kit-tck
        run: sbx/tool/install-kit-tck.sh
      - name: Install sbx
        run: sbx/tool/install-sbx.sh
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.dockerHubUsername }}
          password: ${{ secrets.dockerHubToken }}
      # Pushed by digest only: no tag points to the kit until it passed every
      # check, carries a signature and an attestation.
      - id: build
        name: Build and push kit by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sbx/${{ matrix.kit }}
          file: sbx/${{ matrix.kit }}/${{ matrix.kit }}.yaml
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The commit the kit was built from.
          annotations: index:org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          pull: true
          no-cache: true
      - name: Validate kit
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: kit-tck validate --verbose "$IMAGE@$DIGEST"
      - name: Sign kit
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: sbx kit sign "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          sbx kit verify "$IMAGE@$DIGEST" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$SIGNER_ISSUER"
      - name: Verify attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        # From the registry copy, which is what consumers of the kit get.
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --cert-oidc-issuer "$SIGNER_ISSUER" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      # A carbon copy of the verified index, so the tags resolve to exactly the
      # signed and attested digest.
      - name: Tag kit
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create --prefer-index=false \
            $(printf -- '--tag %s ' "${tags[@]}") "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            actual=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$actual" != "$DIGEST" ]; then
              echo "::error::$tag points to $actual instead of $DIGEST" >&2
              exit 1
            fi
            echo "$tag -> $DIGEST"
          done
