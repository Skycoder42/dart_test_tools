name: Continuos Integration and Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    paths-ignore:
      - flatpak/flutter-extension
      - .github/workflows/flatpak-flutter-extension.yaml
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - flatpak/flutter-extension
      - .github/workflows/flatpak-flutter-extension.yaml

jobs:
  renovate-lockfile:
    name: Validate Renovate lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tool/renovate
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: tool/renovate/package.json
          cache: npm
          cache-dependency-path: tool/renovate/package-lock.json
      - name: Install Renovate
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: tool/renovate
      - name: Lint Renovate lockfile
        run: npm run lint-lockfile
        working-directory: tool/renovate
      - name: Verify Renovate runs
        run: node_modules/.bin/renovate --version
        working-directory: tool/renovate

  ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      buildRunner: true
      unitTestPaths: ""
      integrationTestPaths: test/integration
      integrationTestSetup: >-
        {
          "linux": "dart run tool/ci_install_flutter.dart",
          "windows": "dart run tool/ci_install_flutter.dart",
          "macos": "dart run tool/ci_install_flutter.dart"
        }
      panaScoreThreshold: 30 # should be 20
    secrets:
      integrationTestEnvVars: |
        TEST_KEY=test-value

  cd:
    name: CD
    needs:
      - ci
    uses: Skycoder42/dart_test_tools/.github/workflows/release.yml@main
    permissions:
      contents: write
      actions: write
    with:
      publishWorkflow: dart_test_tools_cd.yml

  renovate:
    name: Renovate
    needs:
      - renovate-lockfile
      - ci
    if: ${{ !cancelled() }}
    uses: Skycoder42/dart_test_tools/.github/workflows/renovate-finish.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      needs: ${{ toJSON(needs) }}
