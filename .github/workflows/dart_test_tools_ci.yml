name: Continuos Integration and Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    paths-ignore:
      - flatpak/flutter-extension
      - .github/workflows/flatpak-flutter-extension.yaml
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - flatpak/flutter-extension
      - .github/workflows/flatpak-flutter-extension.yaml

jobs:
  renovate-lockfile:
    name: Validate Renovate lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tool/renovate
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: tool/renovate/package.json
          cache: npm
          cache-dependency-path: tool/renovate/package-lock.json
      - name: Install Renovate
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: tool/renovate
      - name: Lint Renovate lockfile
        run: npm run lint-lockfile
        working-directory: tool/renovate
      - name: Verify Renovate runs
        run: node_modules/.bin/renovate --version
        working-directory: tool/renovate

  ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      buildRunner: true
      unitTestPaths: test/unit
      minCoverage: 0 # the tests are not meant to cover everything
      integrationTestPaths: test/integration
      integrationTestSetup: >-
        {
          "linux": "bash tool/setup_integration.sh",
          "windows": "bash tool/setup_integration.sh",
          "macos": "bash tool/setup_integration.sh"
        }
      panaScoreThreshold: 30 # should be 20
    secrets:
      integrationTestEnvVars: |
        TEST_KEY=test-value

  sbx-kits:
    name: Sandbox kits
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/sbx-kits-validate.yml
    permissions:
      contents: read

  cd:
    name: CD
    needs:
      - ci
    uses: Skycoder42/dart_test_tools/.github/workflows/release.yml@main
    permissions:
      contents: write
      actions: write
    with:
      publishWorkflow: dart_test_tools_cd.yml

  renovate:
    name: Renovate
    needs:
      - renovate-lockfile
      - ci
      - sbx-kits
    if: ${{ !cancelled() }}
    uses: Skycoder42/dart_test_tools/.github/workflows/renovate-finish.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      needs: ${{ toJSON(needs) }}
      # The merge triggers no push event: start the release chain, and the
      # kit publishing if the pull request changed a kit.
      dispatchWorkflow: |
        dart_test_tools_ci.yml
        ${{ needs.sbx-kits.outputs.kits != '' && needs.sbx-kits.outputs.kits != '[]' && 'sbx-kits.yml' || '' }}
