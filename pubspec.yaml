name: dart_test_tools
description: Additional tools and helpers for writing dart unit tests and GitHub
  Actions Workflows.
version: 8.2.4
homepage: https://github.com/Skycoder42/dart_test_tools

environment:
  sdk: ^3.14.0

executables:
  generate-build-number: generate_build_number
  generate-pkgbuild: generate_pkgbuild
  cider:
  flatpak-repo-init: flatpak_repo_init
  export-xml-changelog: export_xml_changelog
  generate-cask: generate_cask
  generate-nfpm: generate_nfpm
  renovate-post-upgrade: renovate_post_upgrade
  renovate-config: renovate_config
  auto-export: auto_export
  setup-hooks: setup_hooks
  flutter-compat: flutter_compat

dependencies:
  analysis_server_plugin: ^0.3.26
  analyzer: ">=13.3.0 <15.0.0"
  args: ^2.7.0
  async: ^2.13.1
  build: ">=4.0.11 <5.0.0"
  build_config: ^1.3.3
  change: ^0.7.5
  checked_yaml: ^2.0.4
  cider: ^0.2.10
  code_builder: ^4.13.0
  collection: ^1.19.1
  crypto: ^3.0.8
  dart_style: ^3.1.14
  dotenv: ^4.2.0
  flutter_lints: ^6.0.0
  freezed_annotation: ^3.1.0
  glob: ^2.2.0
  json_annotation: ^4.12.0
  lint: ^2.14.0
  lints: ^6.1.0
  logging: ^1.3.0
  markdown: ^7.3.1
  meta: ^1.19.0
  mocktail: ^1.0.5
  mustache_template: ^2.0.6
  path: ^1.9.1
  pub_semver: ^2.2.1
  pubspec_parse: ^1.7.0
  source_gen: ^4.3.1
  source_helper: ^1.4.0
  stack_trace: ^1.12.2
  stream_channel: ^2.1.4
  synchronized: ^3.6.1+1
  test: ^1.32.0
  xml: ^7.1.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
  yaml_writer: ^2.1.0

dev_dependencies:
  build_runner: ^2.16.2
  checks: ^0.4.0
  freezed: ^4.0.3
  html: ^0.15.7
  http: ^1.6.0
  json_serializable: ^6.15.2
  mockito: ^5.8.1

cider:
  link_template:
    tag: https://github.com/Skycoder42/dart_test_tools/releases/tag/v%tag% # initial release link template
    diff: https://github.com/Skycoder42/dart_test_tools/compare/v%from%...v%to% # subsequent releases link template

renovate:
  pre_build_extra_managers: regex
  pre_build_command: dart run sbx/tool/update_flutter_skills.dart
